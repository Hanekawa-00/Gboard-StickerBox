name: Android Debug
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 36 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Check manifest and Xposed configuration
        run: python3 scripts/check_project.py
      - name: Compile APK, unit tests, Android lint
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify APK and merged manifest
        run: |
          python3 scripts/check_project.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk > app/build/reports/merged-manifest.xml
          python3 scripts/check_merged_manifest.py app/build/reports/merged-manifest.xml
      - name: Package deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gboard-StickerBox-debug.apk
          cp README.md RESEARCH.md TESTING.md dist/
          python3 scripts/build_results.py dist/BUILD-RESULTS.md
          git archive --format=zip --prefix=Gboard-StickerBox/ -o dist/Gboard-StickerBox-Source.zip HEAD
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Gboard-StickerBox-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  emulator-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM on hosted runner
        run: sudo chmod a+rw /dev/kvm
      - name: Test manager and storage on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n io.github.stickerbox/.ui.MainActivity
            python3 scripts/check_emulator_permissions.py
            adb exec-out screencap -p > app/build/reports/manager-emulator.png
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-emulator-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
